{% extends "company/base.html" %}

{% block title %}Керівництво{% endblock %}

{% block content %}
<h1>Керівництво компанії</h1>
<div class="cards">
    {% for person in people %}
    <article class="card person">
        <div class="avatar">{{ person.initials }}</div>
        <div class="card-body">
            <h3>{{ person.name }}</h3>
            <p class="role">{{ person.role }}</p>
            <p>{{ person.bio }}</p>
        </div>
    </article>
    {% endfor %}
</div>
{% endblock %}

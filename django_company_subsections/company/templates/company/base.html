<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Моя компанія{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; line-height: 1.5; color: #222; }
        nav { background: #1f2a44; padding: .75rem 1.5rem; }
        nav a { color: #cfd6e6; text-decoration: none; margin-right: 1.25rem; }
        nav a.active { color: #fff; font-weight: 600; }
        main { max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    </style>
</head>
<body>
    <nav>
        {% for key, url, label in nav %}
        <a href="{{ url }}" {% if key == current %}class="active"{% endif %}>{{ label }}</a>
        {% endfor %}
    </nav>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
